name: ci

on:
  push:
    paths-ignore:
      - "probe/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build only the pure-Kotlin engine in this job.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests
          if-no-files-found: ignore
      - name: Publish dependency bundle for offline development
        if: contains(github.event.head_commit.message, '[deps]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/export_m2.py ~/.gradle/caches/modules-2/files-2.1 m2
          (cd m2 && zip -qr ../m2.zip .)
          ls -la m2.zip
          gh release delete dev-deps -y --cleanup-tag || true
          gh release create dev-deps m2.zip --prerelease --target "${GITHUB_SHA}" \
            --title "Development dependency bundle" \
            --notes "Maven-layout bundle of build dependencies for offline development sandboxes. Not an app release."
